name: CricOS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck, Test & Deployment Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Workspaces
        run: pnpm -r build

      - name: Strict TypeScript Typecheck
        run: pnpm -r typecheck

      - name: Run Test Suite (Minimal Tokens Protocol)
        run: ./pipeline.sh test --summary

      - name: Run Project Health Doctor
        run: ./pipeline.sh doctor

      - name: Validate Pre-Flight Deployment Invariants
        run: node scripts/validate-deployment.mjs
        env:
          NODE_ENV: test
