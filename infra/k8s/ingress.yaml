apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cricos-ingress
  namespace: cricos-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.cricos.io
      secretName: cricos-tls-cert
  rules:
    - host: api.cricos.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cricos-api-service
                port:
                  number: 80
