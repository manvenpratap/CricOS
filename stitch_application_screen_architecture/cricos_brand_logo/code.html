<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="cric-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E599" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Hexagonal Athletic Emblem with Stumps and Seam Ball -->
  <g transform="translate(10, 8)" filter="url(#emerald-glow)">
    <polygon points="24,2 44,13 44,35 24,46 4,35 4,13" fill="#0A101C" stroke="url(#cric-grad)" stroke-width="2.5"/>
    <!-- Cricket Stumps in Center -->
    <line x1="18" y1="16" x2="18" y2="33" stroke="#00E599" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="14" x2="24" y2="33" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="16" x2="30" y2="33" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
    <!-- Bails -->
    <line x1="16" y1="15" x2="32" y2="15" stroke="#00E599" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Seam Arc -->
    <path d="M 12 36 Q 24 40 36 36" stroke="#00E599" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
  </g>
  <!-- Brand Wordmark -->
  <text x="66" y="36" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">CRIC<tspan fill="url(#cric-grad)">OS</tspan></text>
  <text x="68" y="49" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#00D2FF" letter-spacing="1.8">BROADCAST CORE</text>
  <circle cx="182" cy="24" r="3.5" fill="#00E599"/>
  <circle cx="182" cy="24" r="7" stroke="#00E599" stroke-width="1" opacity="0.4"/>
</svg>
