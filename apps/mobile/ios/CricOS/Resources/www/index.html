                ctx.beginPath();
                ctx.arc(bp.x, bp.y, 3.2, 0, Math.PI * 2);
                ctx.fill();
              }
              if (endPt && s < 3) {
                ctx.fillStyle = sh.color;
                ctx.font = '800 8.5px "Chakra Petch", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(sh.label, endPt.x, endPt.y - 5);
              }
            }
          }
        }

        // 8. Layer: Hawk-Eye Ball Tracking (HAWKEYE / FUSION)
        if (isFusion || mode === 'HAWKEYE') {
          const deliveries = [
            { bx: 0.08, bz: 2.1, ex: 0.0, ey: 0.68, color: '#FF3366', speed: '144.8 km/h' },
            { bx: -0.18, bz: 4.6, ex: -0.15, ey: 0.35, color: '#00D2FF', speed: '141.2 km/h' },
            { bx: 0.22, bz: -0.2, ex: 0.28, ey: 1.05, color: '#FFB800', speed: '138.5 km/h' }
          ];
          for (let d = 0; d < deliveries.length; d++) {
            const dl = deliveries[d];
            ctx.beginPath();
            let started = false;
            for (let step = 0; step <= 20; step++) {
              const t = step / 20;
              let wx, wy, wz;
              if (t < 0.6) {
                const u = t / 0.6;
                wx = 0.25 + (dl.bx - 0.25) * u;
                wz = -5.8 + (dl.bz - (-5.8)) * u;
                wy = 2.1 * (1 - u * u) + 0.06;
              } else {
                const u = (t - 0.6) / 0.4;
                wx = dl.bx + (dl.ex - dl.bx) * u;
                wz = dl.bz + (5.8 - dl.bz) * u;
                wy = 0.06 + dl.ey * u;
              }
              const p = project(wx, wy, wz);
              if (!p) continue;
              if (!started) { ctx.moveTo(p.x, p.y); started = true; }
              else ctx.lineTo(p.x, p.y);
            }
            if (started) {
              ctx.strokeStyle = dl.color;
              ctx.lineWidth = 2.4;
              ctx.stroke();
            }
            const bouncePt = project(dl.bx, 0.06, dl.bz);
            if (bouncePt) {
              ctx.fillStyle = dl.color;
              ctx.beginPath();
              ctx.arc(bouncePt.x, bouncePt.y, 4, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 9. Layer: DRS LBW Zone & Verdict (DRS / FUSION)
        if (isFusion || mode === 'DRS') {
          const drsCorners = [
            project(-0.32, 0.05, -5.8),
            project(0.32, 0.05, -5.8),
            project(0.32, 0.05, 5.8),
            project(-0.32, 0.05, 5.8)
          ];
          if (drsCorners[0] && drsCorners[1] && drsCorners[2] && drsCorners[3]) {
            ctx.fillStyle = 'rgba(0, 229, 153, 0.28)';
            ctx.beginPath();
            ctx.moveTo(drsCorners[0].x, drsCorners[0].y);
            ctx.lineTo(drsCorners[1].x, drsCorners[1].y);
            ctx.lineTo(drsCorners[2].x, drsCorners[2].y);
            ctx.lineTo(drsCorners[3].x, drsCorners[3].y);
            ctx.closePath();
            ctx.fill();
          }
          const stumpHit = project(0, 0.65, 5.8);
          if (stumpHit) {
            ctx.fillStyle = '#FF3366';
            ctx.beginPath();
            ctx.arc(stumpHit.x, stumpHit.y, 5.5, 0, Math.PI * 2);
            ctx.fill();
            if (mode === 'DRS') {
              ctx.fillStyle = 'rgba(4, 7, 13, 0.88)';
              ctx.strokeStyle = '#FF3366';
              ctx.lineWidth = 1.2;
              ctx.fillRect(w * 0.5 - 105, 36, 210, 24);
              ctx.strokeRect(w * 0.5 - 105, 36, 210, 24);
              ctx.fillStyle = '#FF3366';
              ctx.font = '800 9.5px "Chakra Petch", monospace';
              ctx.textAlign = 'center';
              ctx.fillText('DRS LBW: HITTING STUMPS • OUT!', w * 0.5, 52);
            }
          }
        }

        // 10. Top HUD Telemetry Pill Overlay
        ctx.fillStyle = 'rgba(4, 7, 13, 0.76)';
        ctx.fillRect(10, 10, w - 20, 22);
        ctx.strokeStyle = 'rgba(0, 229, 153, 0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(10, 10, w - 20, 22);

        ctx.fillStyle = '#00E599';
        ctx.font = '800 9px "Chakra Petch", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('CAM: ' + (this.currentPreset || 'AUTO_CAM') + ' • LAYER: ' + mode, 16, 24);

        ctx.fillStyle = '#00D2FF';
        ctx.textAlign = 'right';
        ctx.fillText('LIGHT: ' + (this.currentLighting || 'NIGHT') + ' • 60 FPS', w - 16, 24);

        ctx.restore();
      }

      buildStadium() {
        const THREE = window.THREE;
        this.stadiumGroup = new THREE.Group();
        this.scene.add(this.stadiumGroup);

        // 1. Turf Ground
        const turfMat = new THREE.MeshStandardMaterial({ color: 0x0e3b26, roughness: 0.85, metalness: 0.1 });
        const turfGeo = new THREE.CylinderGeometry(24, 24, 0.4, 32);
        const turfMesh = new THREE.Mesh(turfGeo, turfMat);
        turfMesh.position.y = -0.2;
        this.stadiumGroup.add(turfMesh);

        // 2. Pitch Strip (22 yards)
        const pitchMat = new THREE.MeshStandardMaterial({ color: 0xc29b68, roughness: 0.9, metalness: 0.05 });
        const pitchGeo = new THREE.BoxGeometry(3.2, 0.06, 14);
        const pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
        pitchMesh.position.set(0, 0.02, 0);
        this.stadiumGroup.add(pitchMesh);

        // 3. Crease Lines & 30-yard fielding ring
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const ringGeo = new THREE.RingGeometry(11, 11.2, 48);
        const ringMesh = new THREE.Mesh(ringGeo, lineMat);
        ringMesh.rotation.x = -Math.PI / 2;
        ringMesh.position.y = 0.04;
        this.stadiumGroup.add(ringMesh);

        // Boundary rope
        const ropeMat = new THREE.MeshStandardMaterial({ color: 0x00e599, roughness: 0.4, metalness: 0.3 });
        const ropeGeo = new THREE.TorusGeometry(22.5, 0.18, 8, 48);
        const ropeMesh = new THREE.Mesh(ropeGeo, ropeMat);
        ropeMesh.rotation.x = Math.PI / 2;
        ropeMesh.position.y = 0.08;
        this.stadiumGroup.add(ropeMesh);

        // Stumps at both ends (z = -6 and z = +6)
        const stumpMat = new THREE.MeshStandardMaterial({ color: 0xf5deb3, roughness: 0.6 });
        [-6, 6].forEach(zPos => {
          [-0.2, 0, 0.2].forEach(xPos => {
            const stump = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.72, 8), stumpMat);
            stump.position.set(xPos, 0.38, zPos);
            this.stadiumGroup.add(stump);
          });
          const bail = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.03), stumpMat);
          bail.position.set(0, 0.75, zPos);
          this.stadiumGroup.add(bail);
        });

        // Tactical Groups
        this.wagonArcsGroup = new THREE.Group();
        this.hawkEyeGroup = new THREE.Group();
        this.drsGroup = new THREE.Group();
        this.fieldersGroup = new THREE.Group();

        this.scene.add(this.wagonArcsGroup);
        this.scene.add(this.hawkEyeGroup);
        this.scene.add(this.drsGroup);
        this.scene.add(this.fieldersGroup);

        // Populate Wagon Arcs (8 zones)
        const angles = [0, 45, 90, 135, 180, 225, 270, 315];
        const colors = [0x00E599, 0x00D2FF, 0xFFB800, 0xFF3366, 0x00E599, 0x00D2FF, 0xFFB800, 0xFF3366];
        for (let i = 0; i < angles.length; i++) {
          const rad = (angles[i] * Math.PI) / 180;
          const arcMat = new THREE.MeshBasicMaterial({ color: colors[i], transparent: true, opacity: 0.85 });
          const arcGeo = new THREE.BoxGeometry(0.12, 0.12, 18);
          const arcMesh = new THREE.Mesh(arcGeo, arcMat);
          arcMesh.position.set(Math.sin(rad) * 9, 1.2, Math.cos(rad) * 9);
          arcMesh.rotation.y = rad;
          this.wagonArcsGroup.add(arcMesh);
        }

        // Populate Hawk-Eye trajectory
        const hawkMat = new THREE.MeshBasicMaterial({ color: 0x00D2FF });
        const hawkGeo = new THREE.BoxGeometry(0.08, 0.08, 12);
        const hawkMesh = new THREE.Mesh(hawkGeo, hawkMat);
        hawkMesh.position.set(0.1, 0.7, 0);
        this.hawkEyeGroup.add(hawkMesh);

        // Populate DRS box
        const drsMat = new THREE.MeshBasicMaterial({ color: 0xFF3366, wireframe: true });
        const drsBox = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), drsMat);
        drsBox.position.set(0, 0.45, 6);
        this.drsGroup.add(drsBox);

        // Populate 11 Fielders
        const fielderMat = new THREE.MeshStandardMaterial({ color: 0x00E599, roughness: 0.5 });
        const fielderPositions = [
          [1, 0.6, 7.5], [-1.2, 0.6, 7], [8, 0.6, 5], [10, 0.6, -4],
          [4, 0.6, -11], [-4, 0.6, -11], [-10, 0.6, -3], [-8, 0.6, 6],
          [-12, 0.6, 12], [0, 0.6, 8.5], [0, 0.6, -6.5]
        ];
        for (let f = 0; f < fielderPositions.length; f++) {
          const fMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8), fielderMat);
          fMesh.position.set(fielderPositions[f][0], fielderPositions[f][1], fielderPositions[f][2]);
          this.fieldersGroup.add(fMesh);
        }
      }

      bindTouchEvents() {
        if (!this.canvas) return;
        const onDown = (clientX, clientY) => {
          this.isPointerDown = true;
          this.lastPointer = { x: clientX, y: clientY };
        };
        const onMove = (clientX, clientY) => {
          if (!this.isPointerDown) return;
          const dx = clientX - this.lastPointer.x;
          const dy = clientY - this.lastPointer.y;
          this.lastPointer = { x: clientX, y: clientY };

          this.theta -= dx * 0.008;
          this.phi -= dy * 0.008;
          // Clamp polar angle to avoid clipping under the pitch
          this.phi = Math.max(0.15, Math.min(1.35, this.phi));
          this.updateCameraFromOrbit();
          this.renderScene3D();
        };
        const onUp = () => {
          this.isPointerDown = false;
        };

        this.canvas.addEventListener('pointerdown', e => onDown(e.clientX, e.clientY));
        if (typeof window !== 'undefined') {
          window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
          window.addEventListener('pointerup', onUp);
          window.addEventListener('pointercancel', onUp);
        }

        // Native touch fallback
        this.canvas.addEventListener('touchstart', e => {
          if (e.touches && e.touches.length > 0) {
            onDown(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });
        this.canvas.addEventListener('touchmove', e => {
          if (e.touches && e.touches.length > 0) {
            onMove(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });
        this.canvas.addEventListener('touchend', onUp, { passive: true });
      }

      updateCameraFromOrbit() {
        if (!this.camera) return;
        const x = this.target.x + this.radius * Math.sin(this.phi) * Math.sin(this.theta);
        const y = this.target.y + this.radius * Math.cos(this.phi);
        const z = this.target.z + this.radius * Math.sin(this.phi) * Math.cos(this.theta);
        this.camera.position.set(x, y, z);
        this._lookAtTarget = { x: this.target.x, y: this.target.y, z: this.target.z };
        this.camera.lookAt(this.target.x, this.target.y, this.target.z);
      }

      setCameraPreset(preset) {
        this.currentPreset = preset;
        if (!this.camera) return;
        if (preset === 'BATSMAN') {
          this.camera.position.set(0, 3.4, 9.2);
          this._lookAtTarget = { x: 0, y: 0.8, z: -6 };
          this.camera.lookAt(0, 0.8, -6);
        } else if (preset === 'PITCH') {
          this.camera.position.set(10.5, 3.2, 0);
          this._lookAtTarget = { x: 0, y: 0.5, z: 0 };
          this.camera.lookAt(0, 0.5, 0);
        } else if (preset === 'HIGH') {
          this.camera.position.set(0, 36, 8);
          this._lookAtTarget = { x: 0, y: 0, z: 0 };
          this.camera.lookAt(0, 0, 0);
        } else if (preset === 'GRANDSTAND') {
          this.camera.position.set(18, 16, 22);
          this._lookAtTarget = { x: 0, y: 1, z: 0 };
          this.camera.lookAt(0, 1, 0);
        } else if (preset === 'PAVILION') {
          this.camera.position.set(0, 12, -26);
          this._lookAtTarget = { x: 0, y: 0, z: 0 };
          this.camera.lookAt(0, 0, 0);
        } else if (preset === 'UMPIRE') {
          this.camera.position.set(0, 3.0, -9.2);
          this._lookAtTarget = { x: 0, y: 0.8, z: 6 };
          this.camera.lookAt(0, 0.8, 6);
        } else {
          // AUTO / AUTO_CAM / RESET
          this.theta = 0.85;
          this.phi = 0.68;
          this.updateCameraFromOrbit();
        }
        this.renderScene3D();
      }

      setVisualMode(mode) {
        this.currentMode = mode;
        const isFusion = mode === 'FUSION';
        if (this.wagonArcsGroup) this.wagonArcsGroup.visible = isFusion || mode === 'WAGON';
        if (this.hawkEyeGroup) this.hawkEyeGroup.visible = isFusion || mode === 'HAWKEYE';
        if (this.drsGroup) this.drsGroup.visible = isFusion || mode === 'DRS';
        if (this.fieldersGroup) this.fieldersGroup.visible = isFusion || mode === 'FIELD' || mode === 'FIELDERS';
        this.renderScene3D();
      }

      setLighting(lighting) {
        this.currentLighting = lighting;
        if (!this.ambLight || !this.sunLight) return;
        if (lighting === 'DAY') {
          this.ambLight.intensity = 0.9;
          this.sunLight.intensity = 1.1;
          for (let i = 0; i < this.floodlights.length; i++) this.floodlights[i].intensity = 0.1;
        } else if (lighting === 'DUSK') {
          this.ambLight.intensity = 0.5;
          this.sunLight.intensity = 0.7;
          for (let i = 0; i < this.floodlights.length; i++) this.floodlights[i].intensity = 0.5;
        } else {
          // NIGHT
          this.ambLight.intensity = 0.35;
          this.sunLight.intensity = 0.2;
          for (let i = 0; i < this.floodlights.length; i++) this.floodlights[i].intensity = 0.85;
        }
        this.renderScene3D();
      }

      resize() {
        this.renderScene3D();
      }

      stop() {
        this.isPaused = true;
        if (this.animFrameId && typeof cancelAnimationFrame !== 'undefined') {
          cancelAnimationFrame(this.animFrameId);
          this.animFrameId = null;
        }
      }
    }

    class MobileThreeTrophyCabinet {
      constructor() {
        this.canvas = (typeof document !== 'undefined') ? document.getElementById('mobileTrophyCanvas') : null;
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.animFrameId = null;
        this.isPaused = false;
        this.isInitialized = false;
        this.currentTrophy = 'PREMIER_CUP';
        this.autoRotate = true;
        this.trophyGroup = null;
        this.rotY = 0;
        this.isPointerDown = false;
        this.lastX = 0;
      }

      init(trophyType) {
        const liveCanvas = (typeof document !== 'undefined') ? document.getElementById('mobileTrophyCanvas') : null;
        if (!liveCanvas) return;
        if (this.canvas !== liveCanvas) {
          this.stop();
          this.canvas = liveCanvas;
          this.isInitialized = false;
        }
        if (trophyType) this.currentTrophy = trophyType;
        if (this.isInitialized && !this.isPaused) {
          this.buildTrophy(this.currentTrophy);
          this.renderTrophy3D();
          return;
        }

        initMobileThreeFallback();
        const THREE = window.THREE;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(40, 340 / 210, 0.1, 100);
        this.trophyGroup = new THREE.Group();
        this.scene.add(this.trophyGroup);
        this.renderer = { domElement: this.canvas, render: () => this.renderTrophy3D() };

        this.buildTrophy(this.currentTrophy);
        this.bindTouchEvents();
        this.isInitialized = true;
        this.isPaused = false;
        this.renderTrophy3D();

        const animate = () => {
          if (this.isPaused) {
            this.animFrameId = null;
            return;
          }
          this.animFrameId = (typeof requestAnimationFrame !== 'undefined') ? requestAnimationFrame(animate) : null;
          if (this.autoRotate && !this.isPointerDown) {
            this.rotY += 0.018;
          }
          if (this.trophyGroup) {
            this.trophyGroup.rotation.y = this.rotY;
          }
          this.renderTrophy3D();
        };
        this.animFrameId = (typeof requestAnimationFrame !== 'undefined') ? requestAnimationFrame(animate) : null;
      }

      renderTrophy3D() {
        if (!this.canvas || typeof this.canvas.getContext !== 'function') return;
        const ctx = this.canvas.getContext('2d');
        if (!ctx) return;
        const rect = (typeof this.canvas.getBoundingClientRect === 'function') ? this.canvas.getBoundingClientRect() : { width: 340, height: 210 };
        const dpr = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
        const w = Math.max(Math.round(rect.width || 340), 240);
        const h = Math.max(Math.round(rect.height || 210), 160);
        if (this.canvas.width !== w * dpr || this.canvas.height !== h * dpr) {
          this.canvas.width = w * dpr;
          this.canvas.height = h * dpr;
        }
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.fillStyle = '#050A14';
        ctx.fillRect(0, 0, w, h);

        const cx = w * 0.5, cy = h * 0.55;
        const glow = ctx.createRadialGradient(cx, cy - 15, 8, cx, cy - 15, 110);
        glow.addColorStop(0, this.currentTrophy === 'MVP_SHIELD' ? 'rgba(0, 210, 255, 0.28)' : 'rgba(255, 184, 0, 0.3)');
        glow.addColorStop(1, 'rgba(5, 10, 20, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        // Pedestal Base
        ctx.fillStyle = '#1E293B';
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 58, 56, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const sheen = Math.sin(this.rotY * 2) * 18;
        if (this.currentTrophy === 'MVP_SHIELD') {
          ctx.fillStyle = '#0EA5E9';
          ctx.strokeStyle = '#E0F2FE';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(cx, cy - 5, Math.max(18, Math.abs(Math.cos(this.rotY)) * 54), 56, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#FFB800';
          ctx.beginPath();
          ctx.arc(cx + sheen * 0.3, cy - 5, 16, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.currentTrophy === 'GOLDEN_BAT') {
          const bw = Math.max(10, Math.abs(Math.cos(this.rotY)) * 28);
          ctx.fillStyle = '#F59E0B';
          ctx.strokeStyle = '#FEF08A';
          ctx.lineWidth = 2;
          ctx.fillRect(cx - bw * 0.5, cy - 42, bw, 88);
          ctx.strokeRect(cx - bw * 0.5, cy - 42, bw, 88);
          ctx.fillStyle = '#00E599';
          ctx.fillRect(cx - 5, cy - 75, 10, 34);
        } else {
          // PREMIER_CUP
          const cw = Math.max(24, Math.abs(Math.cos(this.rotY * 0.5)) * 46);
          ctx.fillStyle = '#F59E0B';
          ctx.strokeStyle = '#FEF08A';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx - cw, cy - 48);
          ctx.quadraticCurveTo(cx, cy + 25, cx + cw, cy - 48);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillRect(cx - 10, cy - 5, 20, 52);
        }
        ctx.restore();
      }

      buildTrophy(type) {
        const THREE = window.THREE;
        this.currentTrophy = type || 'PREMIER_CUP';
        while (this.trophyGroup.children.length > 0) {
          this.trophyGroup.remove(this.trophyGroup.children[0]);
        }
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xffb800, metalness: 0.9, roughness: 0.2 });
        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 0.5, 1.2, 16), goldMat);
        this.trophyGroup.add(bowl);
        this.renderTrophy3D();
      }

      bindTouchEvents() {
        if (!this.canvas) return;
        const onDown = (clientX) => { this.isPointerDown = true; this.lastX = clientX; };
        const onMove = (clientX) => {
          if (!this.isPointerDown) return;
          const dx = clientX - this.lastX;
          this.lastX = clientX;
          this.rotY += dx * 0.018;
          this.renderTrophy3D();
        };
        const onUp = () => { this.isPointerDown = false; };
        this.canvas.addEventListener('pointerdown', e => onDown(e.clientX));
        if (typeof window !== 'undefined') {
          window.addEventListener('pointermove', e => onMove(e.clientX));
          window.addEventListener('pointerup', onUp);
        }
        this.canvas.addEventListener('touchstart', e => {
          if (e.touches && e.touches.length > 0) onDown(e.touches[0].clientX);
        }, { passive: true });
        this.canvas.addEventListener('touchmove', e => {
          if (e.touches && e.touches.length > 0) onMove(e.touches[0].clientX);
        }, { passive: true });
        this.canvas.addEventListener('touchend', onUp, { passive: true });
      }

      toggleAutoRotate() {
        this.autoRotate = !this.autoRotate;
        return this.autoRotate;
      }

      stop() {
        this.isPaused = true;
        if (this.animFrameId && typeof cancelAnimationFrame !== 'undefined') {
          cancelAnimationFrame(this.animFrameId);
          this.animFrameId = null;
        }
      }
    }

      renderBat3D() {

        if (!ctx) return;
        const rect = (typeof this.canvas.getBoundingClientRect === 'function') ? this.canvas.getBoundingClientRect() : { width: 340, height: 210 };

      buildBat() {

        this.bladeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.72, 2.0, 0.2), bladeMat);
        this.bladeMesh.position.set(0, 0.9, 0);
        this.batGroup.add(this.bladeMesh);

        const spineMat = new THREE.MeshStandardMaterial({ color: willowColor, roughness: 0.65 });
        const spine = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.7, 0.12), spineMat);
        spine.position.set(0, 0.9, -0.12);
        this.batGroup.add(spine);

        const handleMat = new THREE.MeshStandardMaterial({ color: 0xdeb887, roughness: 0.8 });
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8, 12), handleMat);
        handle.position.set(0, 2.3, 0);
        this.batGroup.add(handle);

        const gripHex = parseInt(this.currentGripColor.replace('#', '0x'), 16) || 0x00E599;
        const gripMat = new THREE.MeshStandardMaterial({ color: gripHex, roughness: 0.4 });
        this.gripMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.72, 12), gripMat);
        this.gripMesh.position.set(0, 2.32, 0);
        this.batGroup.add(this.gripMesh);

        const toeMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
        const toe = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.08, 0.22), toeMat);
        toe.position.set(0, -0.12, 0);
        this.batGroup.add(toe);
      }

      updateWillowGrade(grade) {
        this.currentWillow = grade || 'Grade 1 English Willow';
        if (!this.bladeMesh) return;
        const willowColor = this.currentWillow.indexOf('Kashmiri') >= 0 ? 0xc99352 : (this.currentWillow.indexOf('Reserve') >= 0 ? 0xf5deb3 : 0xe8d7b8);
        if (this.bladeMesh.material && this.bladeMesh.material.color) {
          this.bladeMesh.material.color.set(willowColor);
        }
      }

      updateGripColor(hex) {
        this.currentGripColor = hex || '#00E599';
        if (!this.gripMesh) return;
        const gripHex = parseInt(this.currentGripColor.replace('#', '0x'), 16) || 0x00E599;
        if (this.gripMesh.material && this.gripMesh.material.color) {
          this.gripMesh.material.color.set(gripHex);
        }
      }

      bindTouchEvents() {
        if (!this.canvas) return;
        const onDown = (clientX, clientY) => {
          this.isPointerDown = true;
          this.lastPointer = { x: clientX, y: clientY };
        };
        const onMove = (clientX, clientY) => {
          if (!this.isPointerDown) return;
          const dx = clientX - this.lastPointer.x;
          const dy = clientY - this.lastPointer.y;
          this.lastPointer = { x: clientX, y: clientY };
          this.rotY += dx * 0.015;
          this.rotX = Math.max(-0.6, Math.min(0.6, this.rotX + dy * 0.015));
        };
        const onUp = () => {
          this.isPointerDown = false;
        };

        this.canvas.addEventListener('pointerdown', e => onDown(e.clientX, e.clientY));
        if (typeof window !== 'undefined') {
          window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
          window.addEventListener('pointerup', onUp);
        }
        this.canvas.addEventListener('touchstart', e => {
          if (e.touches && e.touches.length > 0) onDown(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        this.canvas.addEventListener('touchmove', e => {
          if (e.touches && e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        this.canvas.addEventListener('touchend', onUp, { passive: true });
      }

      stop() {
        this.isPaused = true;
        if (this.animFrameId && typeof cancelAnimationFrame !== 'undefined') {
          cancelAnimationFrame(this.animFrameId);
          this.animFrameId = null;
        }
      }
    }

    window.initMobileThreeFallback = initMobileThreeFallback;
    window.MobileThreeStadiumPitch = MobileThreeStadiumPitch;
    window.MobileThreeTrophyCabinet = MobileThreeTrophyCabinet;
    window.MobileThreeBatConfigurator = MobileThreeBatConfigurator;

    const app = new StandaloneMobileApp();
    window.cricosMobileApp = app;
    app.setTheme(app.currentTheme, false);
    app.render();
    if (typeof setTimeout !== 'undefined') {
      setTimeout(() => CricOSMotionFX.init(), 100);
    } else {
      CricOSMotionFX.init();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.cricosMobileApp) {
        if (window.cricosMobileApp.extraPickerOpen) {
          window.cricosMobileApp.closeExtraRunsPickerSheet();
        } else if (window.cricosMobileApp.wagonPickerOpen) {
          window.cricosMobileApp.closeWagonPickerSheet();
        } else if (window.cricosMobileApp.activeActionSheet) {
          window.cricosMobileApp.closeActionSheet();
        } else if (window.cricosMobileApp.personaSheetOpen) {
          window.cricosMobileApp.closePersonaSheet();
        }
      }
    });

    // Hover-Only Delayed Tooltip Engine (HOVER_DELAY_MS = 450ms; never triggers on touch, click, or focus)
    (function () {
      const HOVER_DELAY_MS = 450;
      let activeTooltip = null;
      let activeTrigger = null;
      let pendingTrigger = null;
      let showTimer = null;
      let hideTimer = null;
      let lastPointerType = 'mouse';

      function getTooltipElement() {
        let el = document.getElementById('universal-tooltip-popover');
        if (!el) {
          el = document.createElement('div');
          el.id = 'universal-tooltip-popover';
          el.className = 'uni-tooltip';
          el.setAttribute('role', 'tooltip');
          el.setAttribute('aria-hidden', 'true');
          el.style.cssText = 'position:absolute;z-index:99999;display:none;max-width:260px;padding:6px 11px;font-size:11.5px;font-weight:500;line-height:1.4;border-radius:8px;pointer-events:none;background:rgba(15,23,42,0.95);color:#f8fafc;border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 20px rgba(0,0,0,0.5);opacity:0;transition:opacity 120ms ease-out;';
          document.body.appendChild(el);
        }
        return el;
      }

      function cancelPendingShow() {
        if (showTimer) {
          clearTimeout(showTimer);
          showTimer = null;
        }
        pendingTrigger = null;
      }

      function show(trigger, text) {
        if (!text) return;
        clearTimeout(hideTimer);
        const tooltip = getTooltipElement();
        tooltip.textContent = text;
        tooltip.style.display = 'block';
        const trigRect = trigger.getBoundingClientRect();
        const ttRect = tooltip.getBoundingClientRect();
        const margin = 8;
        let top = trigRect.top - ttRect.height - margin;
        if (top < margin) top = trigRect.bottom + margin;
        let left = trigRect.left + (trigRect.width / 2) - (ttRect.width / 2);
        if (left < margin) left = margin;
        if (left + ttRect.width > window.innerWidth - margin) left = window.innerWidth - ttRect.width - margin;
        tooltip.style.top = Math.round(top + window.scrollY) + 'px';
        tooltip.style.left = Math.round(left + window.scrollX) + 'px';
        tooltip.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(() => {
          tooltip.style.opacity = '1';
          tooltip.classList.add('visible');
        });
        activeTooltip = tooltip;
        activeTrigger = trigger;
      }

      function hide() {
        cancelPendingShow();
        if (!activeTooltip) return;
        const tooltip = activeTooltip;
        tooltip.style.opacity = '0';
        tooltip.classList.remove('visible');
        tooltip.setAttribute('aria-hidden', 'true');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!activeTooltip) tooltip.style.display = 'none';
        }, 130);
        activeTooltip = null;
        activeTrigger = null;
      }

      document.addEventListener('pointermove', (e) => {
        if (e.pointerType) lastPointerType = e.pointerType;
      }, { passive: true });

      document.addEventListener('mouseover', (e) => {
        if (lastPointerType === 'touch') return;
        const trigger = e.target && e.target.closest ? e.target.closest('[data-tooltip]') : null;
        if (!trigger) {
          cancelPendingShow();
          if (activeTooltip) hide();
          return;
        }
        if (trigger === activeTrigger || trigger === pendingTrigger) return;
        if (activeTooltip) hide();
        cancelPendingShow();
        const text = trigger.getAttribute('data-tooltip');
        if (!text) return;
        pendingTrigger = trigger;
        showTimer = setTimeout(() => {
          showTimer = null;
          if (pendingTrigger === trigger && document.body.contains(trigger)) {
            pendingTrigger = null;
            show(trigger, text);
          }
        }, HOVER_DELAY_MS);
      });

      document.addEventListener('mouseout', (e) => {
        const related = e.relatedTarget;
        if (pendingTrigger && (!related || !pendingTrigger.contains(related))) {
          cancelPendingShow();
        }
        if (activeTrigger && (!related || !activeTrigger.contains(related))) {
          hide();
        }
      });

      document.addEventListener('pointerdown', () => {
        cancelPendingShow();
        if (activeTooltip) hide();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          cancelPendingShow();
          if (activeTooltip) hide();
        }
      });
    })();
  </script>
