<!DOCTYPE html>
<html lang="en" class="is-native-app is-native-ios">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04070D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CricOS — Consumer Mobile App (iOS & Android)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pitch: #04070D;
      --turf-emerald: #00E599;
      --cyan: #00D2FF;
      --amber: #FFB800;
      --rose: #FF3366;
      --purple: #A855F7;

      /* Emil Kowalski Animation, Physics & Native Mobile Tokens */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
      --duration-fast: 120ms;
      --duration-normal: 200ms;
      --duration-modal: 280ms;
    }
    * { box-sizing: border-box; }
    html {
      -webkit-tap-highlight-color: transparent;
      height: 100%;
      overscroll-behavior: none;
    }
    button, input, select, textarea {
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }
    input, select, textarea {
      font-size: 16px;
    }
    .sheet-drag-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
      margin: 8px auto 14px auto;
    }

    /* ==========================================================================
       Design System Themes: Swiss Minimal & Nordic Editorial
       ========================================================================== */
    /* 1. Swiss Minimal Theme (Architectural, High-Contrast Modernist Grid) */
    body[data-theme="swiss"], html[data-theme="swiss"] {
      --bg-pitch: #F8F9FA;
      --turf-emerald: #059669;
      --cyan: #0284C7;
      --amber: #D97706;
      --rose: #DC2626;
      --purple: #7C3AED;
      background-color: #F8F9FA !important;
      background-image: radial-gradient(circle, #CBD5E1 0.75px, transparent 0.75px) !important;
      background-size: 20px 20px !important;
      color: #0F172A !important;
    }
    body[data-theme="swiss"] .mobile-device-shell {
      background: #FFFFFF !important;
      border-color: #CBD5E1 !important;
      border-radius: 6px !important;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06) !important;
    }
    body[data-theme="swiss"] .mobile-app-bar,
    body[data-theme="swiss"] .mobile-header {
      background: #FFFFFF !important;
      border-bottom: 2px solid #0F172A !important;
      color: #0F172A !important;
    }
    body[data-theme="swiss"] .status-bar {
      background: #F8F9FA !important;
      color: #0F172A !important;
    }
    body[data-theme="swiss"] .mobile-app-title {
      color: #0F172A !important;
      letter-spacing: -0.02em !important;
      font-weight: 800 !important;
    }
    body[data-theme="swiss"] .mobile-nav-bar,
    body[data-theme="swiss"] .mobile-bottom-nav {
      background: #FFFFFF !important;
      border-top: 1px solid #CBD5E1 !important;
    }
    body[data-theme="swiss"] .mobile-nav-item {
      color: #475569 !important;
    }
    body[data-theme="swiss"] .mobile-nav-item.active {
      color: #0F172A !important;
      font-weight: 800 !important;
    }
    body[data-theme="swiss"] .mobile-card,
    body[data-theme="swiss"] .mobile-sheet,
    body[data-theme="swiss"] .mobile-extra-picker-sheet,
    body[data-theme="swiss"] .theme-selection-card {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 6px !important;
      color: #0F172A !important;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04) !important;
    }
    body[data-theme="swiss"] .mobile-pad-btn {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 4px !important;
      color: #0F172A !important;
      font-weight: 800 !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03) !important;
    }
    body[data-theme="swiss"] .btn-swap-strike {
      background: #ECFDF5 !important;
      border: 1px solid #059669 !important;
      border-radius: 4px !important;
      color: #059669 !important;
    }
    body[data-theme="swiss"] .btn-mobile-undo {
      background: #F1F5F9 !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 4px !important;
      color: #334155 !important;
    }
    body[data-theme="swiss"] .striker-card,
    body[data-theme="swiss"] .non-striker-card,
    body[data-theme="swiss"] .bowler-card {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 4px !important;
      color: #0F172A !important;
    }
    body[data-theme="swiss"] .over-bubble {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      color: #0F172A !important;
    }
    body[data-theme="swiss"] input,
    body[data-theme="swiss"] select,
    body[data-theme="swiss"] textarea {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 4px !important;
      color: #0F172A !important;
    }
    body[data-theme="swiss"] .mobile-subnav-btn {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      border-radius: 4px !important;
      color: #475569 !important;
    }
    body[data-theme="swiss"] .mobile-subnav-btn.active {
      background: #0F172A !important;
      color: #FFFFFF !important;
      border-color: #0F172A !important;
    }

    /* 2. Nordic Editorial Theme (Warm Oat Paper, Curvature, Organic Earth & Pine) */
    body[data-theme="nordic"], html[data-theme="nordic"] {
      --bg-pitch: #F5F0E8;
      --turf-emerald: #15803D;
      --cyan: #0369A1;
      --amber: #C2410C;
      --rose: #BE123C;
      --purple: #6B21A8;
      background-color: #F5F0E8 !important;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(194, 65, 12, 0.07) 0%, transparent 65%) !important;
      color: #292524 !important;
    }
    body[data-theme="nordic"] .mobile-device-shell {
      background: #FCFBF8 !important;
      border-color: #E6DFD5 !important;
      border-radius: 20px !important;
      box-shadow: 0 10px 30px rgba(68, 64, 60, 0.05) !important;
    }
    body[data-theme="nordic"] .mobile-app-bar,
    body[data-theme="nordic"] .mobile-header {
      background: #EFE9DF !important;
      border-bottom: 1px solid #E6DFD5 !important;
      color: #292524 !important;
    }
    body[data-theme="nordic"] .status-bar {
      background: #EFE9DF !important;
      color: #292524 !important;
    }
    body[data-theme="nordic"] .mobile-app-title {
      color: #292524 !important;
      letter-spacing: -0.01em !important;
    }
    body[data-theme="nordic"] .mobile-nav-bar,
    body[data-theme="nordic"] .mobile-bottom-nav {
      background: #EFE9DF !important;
      border-top: 1px solid #E6DFD5 !important;
    }
    body[data-theme="nordic"] .mobile-nav-item {
      color: #57534E !important;
    }
    body[data-theme="nordic"] .mobile-nav-item.active {
      color: #15803D !important;
      font-weight: 700 !important;
    }
    body[data-theme="nordic"] .mobile-card,
    body[data-theme="nordic"] .mobile-sheet,
    body[data-theme="nordic"] .mobile-extra-picker-sheet,
    body[data-theme="nordic"] .theme-selection-card {
      background: #FCFBF8 !important;
      border: 1px solid #E6DFD5 !important;
      border-radius: 16px !important;
      color: #292524 !important;
      box-shadow: 0 6px 18px rgba(68, 64, 60, 0.06) !important;
    }
    body[data-theme="nordic"] .mobile-pad-btn {
      background: #FCFBF8 !important;
      border: 1px solid #E6DFD5 !important;
      border-radius: 12px !important;
      color: #292524 !important;
      font-weight: 700 !important;
      box-shadow: 0 2px 5px rgba(68, 64, 60, 0.05) !important;
    }
    body[data-theme="nordic"] input,
    body[data-theme="nordic"] select,
    body[data-theme="nordic"] textarea {
      background: #FCFBF8 !important;
      border: 1px solid #D6D3D1 !important;
      border-radius: 10px !important;
      color: #292524 !important;
    }
    body[data-theme="nordic"] .mobile-subnav-btn {
      background: #FCFBF8 !important;
      border: 1px solid #E6DFD5 !important;
      border-radius: 10px !important;
      color: #57534E !important;
    }
    body[data-theme="nordic"] .mobile-subnav-btn.active {
      background: #15803D !important;
      color: #FFFFFF !important;
      border-color: #15803D !important;
    }

    /* 3. Stadium Night Theme (High-Intensity Broadcast Glassmorphism & Floodlights) */
    body[data-theme="stadium"], html[data-theme="stadium"] {
      --bg-pitch: #04070D;
      --turf-emerald: #00E599;
      --cyan: #00D2FF;
      --amber: #FFB800;
      --rose: #FF3366;
      --purple: #A855F7;
      background-color: #04070D !important;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 229, 153, 0.14) 0%, transparent 65%),
        radial-gradient(circle at 85% 30%, rgba(0, 210, 255, 0.08) 0%, transparent 50%) !important;
      color: #F8FAFC !important;
    }
    body[data-theme="stadium"] .mobile-device-shell {
      background: #04070D !important;
      border-color: rgba(0, 229, 153, 0.3) !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
    }
    body[data-theme="stadium"] .mobile-app-bar,
    body[data-theme="stadium"] .mobile-header {
      background: rgba(6, 10, 18, 0.98) !important;
      border-bottom: 1px solid rgba(0, 229, 153, 0.2) !important;
      color: #F8FAFC !important;
    }
    body[data-theme="stadium"] .status-bar {
      background: #04070D !important;
      color: #F8FAFC !important;
    }
    body[data-theme="stadium"] .mobile-nav-bar,
    body[data-theme="stadium"] .mobile-bottom-nav {
      background: rgba(6, 10, 18, 0.98) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
    body[data-theme="stadium"] .mobile-card,
    body[data-theme="stadium"] .mobile-sheet,
    body[data-theme="stadium"] .mobile-extra-picker-sheet,
    body[data-theme="stadium"] .theme-selection-card {
      background: rgba(14, 22, 36, 0.92) !important;
      border: 1px solid rgba(0, 229, 153, 0.22) !important;
      border-radius: 10px !important;
      color: #F8FAFC !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5) !important;
    }
    body[data-theme="stadium"] .mobile-pad-btn {
      background: rgba(20, 30, 48, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 8px !important;
      color: #F8FAFC !important;
      font-weight: 700 !important;
    }
    body[data-theme="stadium"] .mobile-pad-btn:hover {
      border-color: #00E599 !important;
      color: #00E599 !important;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-pitch);
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 229, 153, 0.08) 0%, transparent 65%);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .preview-header {
      text-align: center;
      margin: 1.5rem 0 1rem;
      max-width: 600px;
      padding: 0 1rem;
    }
    .preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 229, 153, 0.12);
      border: 1px solid rgba(0, 229, 153, 0.3);
      color: #00E599;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .preview-title {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      color: #f8fafc;
    }
    .preview-desc {
      margin: 0.35rem 0 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* High-End Smartphone Frame */
    .device-wrapper {
      position: relative;
      width: min(390px, 92vw);
      height: 844px;
      max-height: 88vh;
      aspect-ratio: 390 / 844;
      background: #000;
      border-radius: 50px;
      box-shadow: 0 0 0 4px #262e3d, 0 0 0 8px #131722, 0 30px 70px rgba(0,0,0,0.9), 0 0 60px rgba(0, 229, 153, 0.18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin-bottom: 2rem;
    }

    /* Dynamic Island Notch */
    .device-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 0 12px rgba(0, 229, 153, 0.2);
      transition: width var(--duration-modal) var(--ease-spring), box-shadow var(--duration-modal) var(--ease-out);
    }
    @media (hover: hover) and (pointer: fine) {
      .device-notch:hover {
        width: 170px;
        box-shadow: 0 0 22px rgba(0, 229, 153, 0.45);
      }
    }
    .notch-camera {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0c121e;
      border: 1px solid #1a2233;
    }
    .notch-sensor {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #070a10;
    }

    /* iOS Status Bar */
    .status-bar {
      height: 48px;
      padding: 12px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #f8fafc;
      z-index: 90;
      background: var(--bg-pitch);
      font-variant-numeric: tabular-nums;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
    }

    /* Screen Viewport (Strict 3-Tier Flex Column: Viewport Frame NEVER Scrolls) */
    .screen-viewport {
      flex: 1 1 auto;
      min-height: 0;
      height: 100%;
      background: var(--bg-pitch);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity 0.15s ease-out;
    }
    .screen-viewport::-webkit-scrollbar { display: none; width: 0px; }

    /* Tier 1: Fixed Mobile Header Inside Viewport */
    .mobile-header {
      flex: 0 0 auto;
      padding: 0.75rem 1rem;
      background: rgba(10, 16, 28, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 50;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Tier 2: Dedicated Scrollable Content Container (Only this element scrolls) */
    .mobile-scroll-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-bottom: 1rem;
    }
    .mobile-scroll-body::-webkit-scrollbar {
      width: 4px;
    }
    .mobile-scroll-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .mobile-scroll-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Tier 3: Fixed Bottom Navigation Bar (Permanently pinned at bottom, never scrolls) */
    .mobile-bottom-nav {
      flex: 0 0 auto;
      position: relative;
      background: rgba(10, 16, 28, 0.96);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.45rem 0.25rem 1.25rem;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .mobile-nav-item {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-size: 0.65rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      cursor: pointer;
      padding: 0.25rem 0.6rem;
      border-radius: 10px;
      min-height: 44px;
      min-width: 44px;
      position: relative;
      transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .mobile-nav-item .mobile-nav-icon {
      font-size: 1.05rem;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .mobile-nav-item.active {
      color: #00FFB2;
      font-weight: 800;
      background: linear-gradient(180deg, rgba(0, 229, 153, 0.22) 0%, rgba(0, 229, 153, 0.05) 100%);
      border: 1px solid rgba(0, 229, 153, 0.45);
      box-shadow: 0 0 14px rgba(0, 229, 153, 0.25), inset 0 2px 0 #00E599;
    }
    .mobile-nav-item.active .mobile-nav-icon {
      transform: scale(1.15);
      filter: drop-shadow(0 0 6px rgba(0, 229, 153, 0.65));
    }
    .mobile-nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -3px;
      width: 14px;
      height: 3px;
      border-radius: 9999px;
      background: #00E599;
      box-shadow: 0 0 8px #00E599;
    }

    /* Home Indicator bar at bottom of modern phone */
    .home-indicator {
      width: 134px;
      height: 4px;
      background: rgba(255,255,255,0.4);
      border-radius: 9999px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }

    /* Accessible Focus & Tactile Feedback */
    :focus-visible {
      outline: 2px solid #00E599 !important;
      outline-offset: 2px !important;
    }
    body[data-theme="swiss"] :focus-visible,
    body[data-theme="swiss"] button:focus-visible,
    body[data-theme="swiss"] a:focus-visible,
    body[data-theme="swiss"] input:focus-visible,
    body[data-theme="swiss"] textarea:focus-visible,
    body[data-theme="swiss"] select:focus-visible {
      outline: 2px solid #0F172A !important;
      outline-offset: 2px !important;
    }
    body[data-theme="nordic"] :focus-visible,
    body[data-theme="nordic"] button:focus-visible,
    body[data-theme="nordic"] a:focus-visible,
    body[data-theme="nordic"] input:focus-visible,
    body[data-theme="nordic"] textarea:focus-visible,
    body[data-theme="nordic"] select:focus-visible {
      outline: 2px solid #15803D !important;
      outline-offset: 2px !important;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00E599 !important;
      outline: none !important;
      box-shadow: 0 0 12px rgba(0, 229, 153, 0.35) !important;
    }
    body[data-theme="swiss"] input:focus,
    body[data-theme="swiss"] select:focus,
    body[data-theme="swiss"] textarea:focus {
      border-color: #0F172A !important;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.12) !important;
    }
    body[data-theme="nordic"] input:focus,
    body[data-theme="nordic"] select:focus,
    body[data-theme="nordic"] textarea:focus {
      border-color: #15803D !important;
      box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.15) !important;
    }
    button, .role-pill, .slot-pill, .mobile-chip, .pad-touch-btn {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    button:active, .role-pill:active, .slot-pill:active, .mobile-chip:active, .pad-touch-btn:active {
      transform: scale(0.97);
    }

    /* Vestibular Motion Safeguard (WCAG 2.2 AA) */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* In-App Toast System */
    .mobile-toast-container {
      position: absolute;
      top: 54px;
      left: 12px;
      right: 12px;
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .mobile-toast {
      pointer-events: auto;
      background: rgba(10, 16, 28, 0.96);
      border: 1px solid rgba(0, 229, 153, 0.4);
      border-radius: 12px;
      padding: 0.65rem 0.85rem;
      font-size: 0.78rem;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: toastSlideDown 0.22s var(--ease-spring) forwards;
    }
    .mobile-toast.success { border-color: rgba(0, 229, 153, 0.6); }
    .mobile-toast.error { border-color: rgba(255, 51, 102, 0.6); color: #ff8099; }
    .mobile-toast.warning { border-color: rgba(255, 184, 0, 0.6); color: #ffca40; }
    .mobile-toast.info { border-color: rgba(0, 210, 255, 0.6); }
    @keyframes toastSlideDown {
      from { transform: translateY(-16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* In-App Modal / Action Sheet System */

      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 10001;
      pointer-events: none;
      text-align: center;
      padding: 0.85rem 1.25rem;
      border-radius: 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 229, 153, 0.4);

    @keyframes bannerPopElastic {
      0% { transform: translate(-50%, -50%) scale(0.3) rotate(-6deg); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.1) rotate(2deg); opacity: 1; }
      35% { transform: translate(-50%, -50%) scale(0.98) rotate(0deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1) translateY(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.85) translateY(-25px); opacity: 0; }

        transparent 20%,
        rgba(0, 229, 153, 0.12) 38%,
        rgba(0, 210, 255, 0.28) 48%,
        rgba(255, 215, 0, 0.22) 58%,
        transparent 75%
      );
      transform: rotate(25deg) translateY(-100%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.7;
      animation: holoFoilSweep 6s ease-in-out infinite;

    @keyframes holoFoilSweep {
      0%, 20% { transform: rotate(25deg) translateY(-120%); }
      50%, 70% { transform: rotate(25deg) translateY(120%); }
      100% { transform: rotate(25deg) translateY(-120%); }

      showToast(msg, type = 'info', duration = 2500) {
        var id = 't-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        this.toasts.push({ id: id, msg: msg, type: type });
        if (window.CricOSSound) window.CricOSSound.playClick();
        try {
          if (window.AndroidBridge && typeof window.AndroidBridge.triggerHaptic === 'function') {
            window.AndroidBridge.triggerHaptic(type === 'error' ? 'error' : 'tap');
          } else if (navigator.vibrate) {
            navigator.vibrate(type === 'error' ? [80, 50, 80] : 30);
          }
        } catch (_) {}
        try {
          if (window.AndroidBridge && typeof window.AndroidBridge.showToast === 'function') {
            window.AndroidBridge.showToast(msg);
          }
        } catch (_) {}
        this.renderToasts();
        var self = this;
        setTimeout(function() {
          self.toasts = self.toasts.filter(function(t) { return t.id !== id; });
          self.renderToasts();
        }, duration);
      }

      renderToasts() {
        var container = document.getElementById('mobileToastContainer');
        if (!container) return;
        var icons = {
          success: '✓',
          error: '✕',
          warning: '⚠️',
          info: 'ℹ'
        };
        var h = '';
        for (var i = 0; i < this.toasts.length; i++) {
          var t = this.toasts[i];
          h += '<div class="mobile-toast ' + (t.type || 'info') + '">';
          h += '<span style="font-weight: 800; font-size: 0.85rem;">' + (icons[t.type] || 'ℹ') + '</span>';
          h += '<span style="flex: 1; font-weight: 600;">' + t.msg + '</span>';
          h += '</div>';
        }
        container.innerHTML = h;
      }

      renderAthleticCard(playerId) {
        var p = (this.playerDatabase && this.playerDatabase[playerId]) || (this.playerDatabase ? this.playerDatabase['p1'] : null);
        if (!p) return '';
        var maxMomentum = Math.max.apply(null, p.momentum) || 50;
        var barsHtml = '';
        for (var i = 0; i < p.momentum.length; i++) {
          var val = p.momentum[i];
          var heightPct = Math.round((val / maxMomentum) * 100);
          var isLatest = i >= p.momentum.length - 4;
          var barBg = isLatest ? 'background: linear-gradient(180deg, #00E599 0%, #00D2FF 100%);' : 'background: rgba(255,255,255,0.18);';
          barsHtml += '<div class="athletic-spectrum-bar" style="height: ' + heightPct + '%; ' + barBg + '" title="Match ' + (i+1) + ': ' + val + ' pts"></div>';
        }

        var h = '<div class="athletic-stats-card" id="mobileAthleticStatsCard">';
        h += '<div class="athletic-hero-section">';
        h += '<div class="athletic-player-meta">';
        h += '<div class="athletic-avatar">#' + p.jersey + '</div>';
        h += '<div>';
        h += '<div style="font-size: 0.95rem; font-weight: 800; color: #f8fafc; font-family: Space Grotesk, sans-serif;">' + p.name + '</div>';
        h += '<div style="font-size: 0.7rem; color: #94a3b8;">' + p.role + ' • ' + p.form + '</div>';
        h += '<div class="athletic-ranking-ribbon">';

        h += '<span>' + p.rank + '</span>';
        h += '</div>';
        h += '</div></div>';

        h += '<div class="athletic-hero-kpi">';
        h += '<div style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Overall Rating</div>';
        h += '<div class="athletic-rating-val">' + p.rating + '</div>';

        var clientY = e.touches ? e.touches[0].clientY : e.clientY;
        var x = clientX - rect.left;
        var y = clientY - rect.top;
        var midX = rect.width / 2;
        var midY = rect.height / 2;
        var tiltX = ((x - midX) / midX) * 14;
        var tiltY = ((y - midY) / midY) * 14;
        card.style.transform = 'perspective(900px) rotateX(' + (-tiltY).toFixed(1) + 'deg) rotateY(' + tiltX.toFixed(1) + 'deg) scale3d(1.02, 1.02, 1.02)';
        if (sheen) {
          var px = ((x / rect.width) * 100).toFixed(0);
          var py = ((y / rect.height) * 100).toFixed(0);
          sheen.style.background = 'radial-gradient(circle at ' + px + '% ' + py + '%, rgba(0, 229, 153, 0.45) 0%, rgba(0, 210, 255, 0.25) 35%, rgba(168, 85, 247, 0.2) 65%, transparent 85%)';

      handleMobileProfilePhoto(event) {
        var self = this;
        var file = event.target.files && event.target.files[0];
        if (!file) return;

        var validTypes = ['image/png', 'image/jpeg', 'image/webp', 'image/gif', 'image/avif'];
        if (validTypes.indexOf(file.type) === -1) {
          self.showToast('⚠️ Invalid format. Use PNG, JPG, WebP, or GIF.', 'error');
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          self.showToast('⚠️ File too large. Maximum 8 MB.', 'error');
          return;
        }

        var reader = new FileReader();
        reader.onload = function(e) {
          self.profile.avatarUrl = e.target.result;
          self.showToast('✓ Profile photo updated!', 'success');
          self._screenChanged = true;
          self.render();
        };
        reader.onerror = function() {
          self.showToast('⚠️ Failed to read image.', 'error');
        };
        reader.readAsDataURL(file);
      }

      initMobileHeroCanvas() {
        var canvas = document.getElementById('mobileHeroStadiumCanvas');
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext('2d');
        var self = this;
        var t = 0;
        if (this._mobileHeroRaf) {
          window.cancelAnimationFrame(this._mobileHeroRaf);
        }
        function drawHeroFrame() {
          if (self.heroGatewayStage !== 'HERO' && self.heroGatewayStage !== 'LOGIN') {
            self._mobileHeroRaf = null;
            return;
          }
          var el = document.getElementById('mobileHeroStadiumCanvas');
          if (!el) return;
          t += 0.025;
          var w = el.width = el.clientWidth || 412;
          var h = el.height = el.clientHeight || 780;
          ctx.clearRect(0, 0, w, h);

          var grad = ctx.createRadialGradient(w * 0.5, h * 0.22, 20, w * 0.5, h * 0.6, Math.max(w, h) * 0.85);
          grad.addColorStop(0, 'rgba(0, 229, 153, 0.16)');
          grad.addColorStop(0.5, 'rgba(0, 210, 255, 0.08)');
          grad.addColorStop(1, 'rgba(3, 7, 16, 0.95)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          var cx = w * 0.5;
          var cy = h * 0.76;
          var rings = [0.44, 0.31, 0.18];
          for (var r = 0; r < rings.length; r++) {
            ctx.beginPath();
            ctx.ellipse(cx, cy, w * rings[r], h * (rings[r] * 0.25), 0, 0, Math.PI * 2);
            ctx.strokeStyle = r === 0 ? 'rgba(0, 229, 153, 0.34)' : 'rgba(0, 210, 255, 0.18)';
            ctx.lineWidth = r === 0 ? 1.8 : 1;
            ctx.stroke();
          }

          var arcs = [
            { tx: cx - w * 0.34, ty: cy - h * 0.08, ph: h * 0.34, color: '#00E599', spd: 0.55, off: 0.0 },
            { tx: cx + w * 0.36, ty: cy - h * 0.06, ph: h * 0.3, color: '#00D2FF', spd: 0.48, off: 0.45 }
          ];
          for (var a = 0; a < arcs.length; a++) {
            var arc = arcs[a];
            var prog = ((t * arc.spd) + arc.off) % 1;
            ctx.beginPath();
            for (var s = 0; s <= prog; s += 0.03) {
              var px = cx + (arc.tx - cx) * s;
              var py = cy + (arc.ty - cy) * s - Math.sin(s * Math.PI) * arc.ph;
              if (s === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = arc.color;
            ctx.lineWidth = 2.4;
            ctx.stroke();

            var bx = cx + (arc.tx - cx) * prog;
            var by = cy + (arc.ty - cy) * prog - Math.sin(prog * Math.PI) * arc.ph;
            ctx.beginPath();
            ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
          }

          self._mobileHeroRaf = window.requestAnimationFrame(drawHeroFrame);
        }
        drawHeroFrame();
      }

      setTheme(themeId, notify = true) {

          if (document.documentElement && typeof document.documentElement.setAttribute === 'function') {
            document.documentElement.setAttribute('data-theme', themeId);
          }
          if (document.body && typeof document.body.setAttribute === 'function') {
            document.body.setAttribute('data-theme', themeId);
          }
        }
        try {
          if (typeof localStorage !== 'undefined' && localStorage.setItem) {
            localStorage.setItem('cricos_design_theme', themeId);
          }
        } catch (_) {}
        if (notify && typeof this.showToast === 'function') {
          var themeNames = {
            swiss: '🇨🇭 Swiss Minimal',
            nordic: '🌾 Nordic Editorial',
            stadium: '🌙 Stadium Night'
          };
          this.showToast((themeNames[themeId] || themeId) + ' Activated', 'success');
        }
        if (typeof this.render === 'function') {
          this.render();
        }

      async requestOtpAction() {
        const input = document.getElementById('authIdentifierInput');
        if (input && input.value) this.identifier = input.value.trim();
        this.isLoading = true;
        this.render();

        try {
          const res = await fetch('/api/v1/auth/otp/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: this.identifier })
          });
          const data = await res.json();
          this.isLoading = false;
          if (res.ok && data.success) {
            this.authStep = 'OTP_INPUT';
            this.code = data.debug_code || '123456';
            this.showToast('Verification code dispatched!', 'success');
          } else {
            this.errorMessage = data.message || 'OTP request failed';
            this.showToast(this.errorMessage, 'error');
          }
        } catch {
          this.isLoading = false;
          this.authStep = 'OTP_INPUT';
          this.code = '123456';
          this.showToast('Test OTP ready: 123456', 'info');
        }
        this.render();
      }

      async verifyOtpAction() {
        const input = document.getElementById('authCodeInput');
        if (input && input.value) this.code = input.value.trim();
        this.isLoading = true;
        this.render();

        var isSignup = this.authMode === 'SIGN_UP';
        var activeRole = isSignup ? (this.signupData.role || 'PLAYER') : (this.role || 'CAPTAIN');

        try {
          const res = await fetch('/api/v1/auth/otp/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: this.identifier, code: this.code, role: activeRole })
          });
          const data = await res.json();
          this.isLoading = false;
          if (res.ok && data.token) {
            this.client.setSession({ token: data.token, role: activeRole });
            this.finalizeAuthAndApplyRole(isSignup);
            return;
          }
        } catch {}

        this.isLoading = false;
        this.finalizeAuthAndApplyRole(isSignup);
      }

      confirmWagonShot(skipDirection) {
        var runs = this.pendingWagonRuns;
        var zone = skipDirection ? (this.currentSelectedZone || 'EXTRA_COVER') : (this.pendingSelectedZone || this.currentSelectedZone || 'EXTRA_COVER');

      scoreBall(runs, chosenZone) {
        if (this.profile.persona !== 'SCORER') {
          this.showToast('🔒 Only official Scorers can score deliveries.', 'warning');
          return;
        }
        if (chosenZone) {
          this.currentSelectedZone = chosenZone;
        }
        if (window.CricOSSound) {
          if (runs === 4 || runs === 6) {
            window.CricOSSound.playBatHit(true);
            window.CricOSSound.playCheer();
          } else {
            window.CricOSSound.playBatHit(false);
          }
        }
        if (window.CricOSMotionFX && typeof window.CricOSMotionFX.triggerCelebration === 'function') {
          if (runs === 6) window.CricOSMotionFX.triggerCelebration('SIX');
          else if (runs === 4) window.CricOSMotionFX.triggerCelebration('FOUR');
        }
        this.matchState.totalRuns += runs;
        this.matchState.legalBalls += 1;
        this.matchState.striker.runs += runs;
        this.matchState.striker.balls += 1;
        if (runs === 4) this.matchState.striker.fours = (this.matchState.striker.fours || 0) + 1;
        if (runs === 6) this.matchState.striker.sixes = (this.matchState.striker.sixes || 0) + 1;

        this.partnership.runs = (this.partnership.runs || 0) + runs;
        this.partnership.balls = (this.partnership.balls || 0) + 1;

        this.matchState.bowler.ballsThisOver += 1;
        this.matchState.bowler.runsConceded += runs;

        var dTag = runs === 0 ? '•' : runs.toString();
        this.matchState.currentOverDeliveries.push(dTag);

        var isSix = runs === 6;
        var isBoundary = runs === 4 || isSix;
        var self = this;
        var zoneDef = this.SHOT_ZONES_DATA.find(function(z) { return z.id === self.currentSelectedZone; });
        var angle = zoneDef ? zoneDef.angleDeg + (Math.random() * 16 - 8) : 247.5;
        var dist = isSix ? 1.16 : (isBoundary ? 0.98 : (runs === 0 ? 0.36 : 0.72));

        this.shotHistory.push({
          id: 's' + Date.now(),
          zone: this.currentSelectedZone,
          runs: runs,
          isBoundary: isBoundary,
          isSix: isSix,
          batterName: this.matchState.striker.name,
          ballNumber: this.matchState.striker.balls,
          angleDeg: angle,
          distanceFraction: dist
        });

        var commBadge = runs === 0 ? 'DOT' : (runs === 4 ? 'FOUR' : (runs === 6 ? 'SIX' : 'RUNS'));
        var commColor = runs === 4 ? '#00E599' : (runs === 6 ? '#c084fc' : (runs === 0 ? '#94a3b8' : '#00D2FF'));
        var ballNum = Math.floor(this.matchState.legalBalls / 6) + '.' + (this.matchState.legalBalls % 6);
        this.matchState.commentary.unshift({
          ball: ballNum,
          badge: commBadge,
          badgeColor: commColor,
          text: runs === 4 ? 'CRACKING BOUNDARY! Slashed cleanly to ' + (zoneDef ? zoneDef.label : 'outfield') + '.' : (runs === 6 ? 'MASSIVE MAXIMUM SIX! Cleared the boundary into the crowd!' : (runs === 0 ? 'Dot ball. Solid forward defence.' : runs + ' run(s) taken briskly between wickets.'))
        });

        if (this.freeHitActive) {
          this.freeHitActive = false;
          this.showToast('Free Hit delivery completed', 'info');
        }

        if (runs % 2 !== 0) {
          const tmp = this.matchState.striker;
          this.matchState.striker = this.matchState.nonStriker;
          this.matchState.nonStriker = tmp;
        }

        if (this.matchState.bowler.ballsThisOver >= 6) {
          this.matchState.bowler.overs += 1;
          this.matchState.bowler.ballsThisOver = 0;
          this.matchState.currentOverDeliveries = [];
          const tmp = this.matchState.striker;
          this.matchState.striker = this.matchState.nonStriker;
          this.matchState.nonStriker = tmp;
          this.showToast('Over completed! Strike rotated.', 'info');
        } else {
          this.showToast('+' + runs + (runs === 1 ? ' run' : ' runs') + ' scored (' + (zoneDef ? zoneDef.shortLabel : 'Field') + ')', 'success', 1200);
        }
        this.syncStanceFromStriker();
        this.render();
      }

      openExtraPickerSheet(type) {
        if (this.profile.persona !== 'SCORER') {
          this.showToast('🔒 Only official Scorers can score extras.', 'warning');
          return;
        }
        if (window.CricOSSound) window.CricOSSound.playClick();
        this.pendingExtraType = type || 'WIDE';
        this.pendingExtraOption = 0;
        this.extraPickerOpen = true;
        this.render();
      }

      closeExtraRunsPickerSheet() {
        this.extraPickerOpen = false;
        this.render();
      }

      switchExtraTypeInPicker(type) {
        if (window.CricOSSound) window.CricOSSound.playClick();
        this.pendingExtraType = type;
        this.pendingExtraOption = 0;
        this.render();
      }

      selectExtraOption(idx) {
        if (window.CricOSSound) window.CricOSSound.playClick();
        this.pendingExtraOption = Number(idx);
        this.render();
      }

      confirmExtraRuns() {
        var type = this.pendingExtraType || 'WIDE';
        var extraDef = this.EXTRA_DELIVERY_TYPES[type] || this.EXTRA_DELIVERY_TYPES['WIDE'];
        var opt = extraDef.options[this.pendingExtraOption] || extraDef.options[0];
        this.extraPickerOpen = false;
        this.applyExtraDelivery(type, opt);
      }

      applyExtraDelivery(type, opt) {
        if (this.profile.persona !== 'SCORER') {
          this.showToast('🔒 Only official Scorers can score extras.', 'warning');
          return;
        }
        var totalRuns = opt.runs;
        var batRuns = opt.batRuns || 0;
        var rotatesStrike = opt.rotatesStrike;
        var isBoundary = opt.isBoundary;

        if (window.CricOSSound) {
          if (isBoundary || opt.isFour || opt.isSix) {
            window.CricOSSound.playBatHit(true);
            window.CricOSSound.playCheer();
          } else {
            window.CricOSSound.playClick();
          }
        }

        this.matchState.totalRuns += totalRuns;
        this.partnership.runs = (this.partnership.runs || 0) + totalRuns;

        if (type === 'WIDE') {
          this.matchState.bowler.runsConceded += totalRuns;
          var tagWd = totalRuns === 1 ? '1wd' : (totalRuns + 'wd');
          this.matchState.currentOverDeliveries.push(tagWd);
          this.showToast('+' + totalRuns + ' Wide recorded (re-bowl)', 'warning');
        } else if (type === 'NO_BALL') {
          this.freeHitActive = true;
          this.matchState.bowler.runsConceded += totalRuns;
          if (batRuns > 0) {
            this.matchState.striker.runs += batRuns;
            this.matchState.striker.balls += 1;
            if (opt.isFour) this.matchState.striker.fours = (this.matchState.striker.fours || 0) + 1;
            if (opt.isSix) this.matchState.striker.sixes = (this.matchState.striker.sixes || 0) + 1;
          }
          var tagNb = batRuns === 0 ? '1nb' : (batRuns + 'nb');
          this.matchState.currentOverDeliveries.push(tagNb);
          this.showToast('⚠️ NO BALL! (+' + totalRuns + ' runs) Free Hit awarded! ⚡', 'warning', 3000);
        } else if (type === 'LEG_BYE') {
          this.matchState.legalBalls += 1;
          this.partnership.balls = (this.partnership.balls || 0) + 1;
          this.matchState.bowler.ballsThisOver += 1;
          var tagLb = totalRuns === 1 ? '1lb' : (totalRuns + 'lb');
          this.matchState.currentOverDeliveries.push(tagLb);
          this.showToast('+' + totalRuns + ' Leg Bye' + (rotatesStrike ? ' (Strike rotated)' : ''), 'info');
        } else if (type === 'BYE') {
          this.matchState.legalBalls += 1;
          this.partnership.balls = (this.partnership.balls || 0) + 1;
          this.matchState.bowler.ballsThisOver += 1;
          var tagB = totalRuns === 1 ? '1b' : (totalRuns + 'b');
          this.matchState.currentOverDeliveries.push(tagB);
          this.showToast('+' + totalRuns + ' Bye' + (rotatesStrike ? ' (Strike rotated)' : ''), 'info');
        }

        var commBadge = type === 'WIDE' ? 'WIDE' : (type === 'NO_BALL' ? 'NO BALL' : (type === 'LEG_BYE' ? 'LEG BYE' : 'BYE'));
        var commColor = type === 'WIDE' ? '#ffb800' : (type === 'NO_BALL' ? '#ff3366' : (type === 'LEG_BYE' ? '#00D2FF' : '#a78bfa'));
        var ballNum = Math.floor(this.matchState.legalBalls / 6) + '.' + (this.matchState.legalBalls % 6);
        this.matchState.commentary.unshift({
          ball: ballNum,
          badge: commBadge,
          badgeColor: commColor,
          text: opt.desc + (opt.batRuns > 0 ? ' (' + opt.batRuns + ' run(s) off bat to ' + this.matchState.striker.name + ')' : '')
        });

        if (rotatesStrike) {
          var tmp = this.matchState.striker;
          this.matchState.striker = this.matchState.nonStriker;
          this.matchState.nonStriker = tmp;
        }

        // Over completion check for legal balls (Byes / Leg Byes)
        if (this.matchState.bowler.ballsThisOver >= 6) {
          this.matchState.bowler.overs += 1;
          this.matchState.bowler.ballsThisOver = 0;
          this.matchState.currentOverDeliveries = [];
          var tmpOver = this.matchState.striker;
          this.matchState.striker = this.matchState.nonStriker;
          this.matchState.nonStriker = tmpOver;
          this.showToast('Over completed! Strike rotated.', 'info');
        }

        this.syncStanceFromStriker();
        this.render();
      }

      scoreExtra(type, runs) {
        if (!runs) {
          this.openExtraPickerSheet(type);
          return;
        }
        var opt = {
          runs: runs,
          batRuns: 0,
          rotatesStrike: runs % 2 !== 0,
          isBoundary: runs >= 4,
          desc: '+' + runs + ' ' + (type === 'WIDE' ? 'Wide' : (type === 'NO_BALL' ? 'No Ball' : (type === 'LEG_BYE' ? 'Leg Bye' : 'Bye')))
        };
        this.applyExtraDelivery(type, opt);
      }

      scoreCompoundExtra(batRuns, extraRuns, extraType) {
        if (this.profile.persona !== 'SCORER') {
          this.showToast('🔒 Only official Scorers can score compound extras.', 'warning');
          return;
        }
        if (window.CricOSSound) window.CricOSSound.playClick();
        var total = batRuns + extraRuns;
        this.matchState.totalRuns += total;
        this.partnership.runs = (this.partnership.runs || 0) + total;
        this.matchState.bowler.runsConceded += total;

        if (extraType === 'WIDE') {
          this.matchState.currentOverDeliveries.push('5wd');
          this.showToast('Wide + 4 Byes (+5 runs total, re-bowl)', 'warning');
        } else if (extraType === 'NO_BALL') {
          this.freeHitActive = true;
          this.matchState.striker.runs += batRuns;
          this.matchState.striker.balls += 1;
          if (batRuns === 4) this.matchState.striker.fours = (this.matchState.striker.fours || 0) + 1;
          if (batRuns === 6) this.matchState.striker.sixes = (this.matchState.striker.sixes || 0) + 1;
          this.matchState.currentOverDeliveries.push(batRuns === 4 ? '4nb' : '6nb');
          this.showToast('No Ball + Boundary (+' + total + ' runs, Free Hit active!) ⚡', 'warning', 3000);
        } else if (extraType === 'PENALTY') {
          this.matchState.currentOverDeliveries.push('+5Pen');
          this.showToast('Penalty Awarded (+5 runs to batting team)', 'warning');
        }
        this.syncStanceFromStriker();
        this.render();
      }

      syncStanceFromStriker() {
        if (this.matchState && this.matchState.striker) {
          var s = this.matchState.striker;
          if (s.stance) {
            this.currentStance = s.stance;
          } else {
            this.currentStance = (s.name && s.name.indexOf('Rohit') !== -1) ? 'LHB' : 'RHB';
            s.stance = this.currentStance;
          }
          this.currentBatterFilter = s.name;
        }
      }

      rotateStrike() {
        if (this.profile.persona !== 'SCORER') {
          this.showToast('🔒 Only official Scorers can swap strike.', 'warning');
          return;
        }
        const tmp = this.matchState.striker;
        this.matchState.striker = this.matchState.nonStriker;
        this.matchState.nonStriker = tmp;
        this.syncStanceFromStriker();
        this.showToast('Strike swapped between batsmen', 'info', 1500);
        this.render();
      }

      undoBall() {
        this.undoLastDelivery();
      }

      undoLastDelivery() {
        if (this.profile.persona !== 'SCORER') {
          this.showToast('🔒 Only official Scorers can undo deliveries.', 'warning');
          return;
        }
        if (this.matchState.currentOverDeliveries.length > 0) {
          var last = this.matchState.currentOverDeliveries.pop();
          if (this.shotHistory.length > 0) {
            this.shotHistory.pop();
          }
          if (last === 'W') {
            this.matchState.totalWickets = Math.max(0, this.matchState.totalWickets - 1);
            this.matchState.bowler.wickets = Math.max(0, this.matchState.bowler.wickets - 1);
            this.matchState.legalBalls = Math.max(0, this.matchState.legalBalls - 1);
            this.matchState.bowler.ballsThisOver = Math.max(0, this.matchState.bowler.ballsThisOver - 1);
          } else if (last.indexOf('wd') !== -1) {
            var rWd = parseInt(last, 10) || 1;
            this.matchState.totalRuns = Math.max(0, this.matchState.totalRuns - rWd);
            this.matchState.bowler.runsConceded = Math.max(0, this.matchState.bowler.runsConceded - rWd);
            this.partnership.runs = Math.max(0, (this.partnership.runs || 0) - rWd);
          } else if (last.indexOf('nb') !== -1) {
            var rNb = parseInt(last, 10) || 1;
            this.matchState.totalRuns = Math.max(0, this.matchState.totalRuns - rNb);
            this.matchState.bowler.runsConceded = Math.max(0, this.matchState.bowler.runsConceded - rNb);
            this.partnership.runs = Math.max(0, (this.partnership.runs || 0) - rNb);
            this.freeHitActive = false;
          } else {
            var r = parseInt(last, 10) || 0;
            this.matchState.totalRuns = Math.max(0, this.matchState.totalRuns - r);
            this.matchState.striker.runs = Math.max(0, this.matchState.striker.runs - r);
            this.matchState.striker.balls = Math.max(0, this.matchState.striker.balls - 1);
            this.partnership.runs = Math.max(0, (this.partnership.runs || 0) - r);
            this.partnership.balls = Math.max(0, (this.partnership.balls || 0) - 1);
            this.matchState.bowler.runsConceded = Math.max(0, this.matchState.bowler.runsConceded - r);
            this.matchState.legalBalls = Math.max(0, this.matchState.legalBalls - 1);
            this.matchState.bowler.ballsThisOver = Math.max(0, this.matchState.bowler.ballsThisOver - 1);
            if (r % 2 !== 0) {
              var tmp = this.matchState.striker;
              this.matchState.striker = this.matchState.nonStriker;
              this.matchState.nonStriker = tmp;
            }
          }
          this.syncStanceFromStriker();
          this.showToast('Last delivery undone per Scorer protocol ↺', 'info');
          this.render();
        } else {
          this.showToast('No deliveries in current over to undo', 'warning');
        }
      }

      filterWagonBatter(name) {
        this.currentBatterFilter = name;
        if (this.matchState) {
          if (this.matchState.striker && this.matchState.striker.name === name && this.matchState.striker.stance) {
            this.currentStance = this.matchState.striker.stance;
          } else if (this.matchState.nonStriker && this.matchState.nonStriker.name === name && this.matchState.nonStriker.stance) {

          } else if (name === 'Rohit S.' || name === 'Hardik P.') {

      renderMobileWagonRays() {
        var centerX = 180;
        var centerY = 156;
        var radius = 162;
        var self = this;
        var filteredShots = this.shotHistory.filter(function(s) {
          if (self.currentBatterFilter !== 'ALL' && s.batterName !== self.currentBatterFilter) return false;
          if (self.currentShotFilter === 'BOUNDARIES') return s.isBoundary;
          if (self.currentShotFilter === 'SINGLES') return !s.isBoundary && s.runs > 0;
          if (self.currentShotFilter === 'DOTS') return s.runs === 0;
          return true;
        });

        var raysHtml = '';
        for (var i = 0; i < filteredShots.length; i++) {
          var shot = filteredShots[i];
          var angle = shot.angleDeg;
          if (this.currentStance === 'LHB') {
            angle = (360 - angle) % 360;
          }
          var rad = ((angle - 90) * Math.PI) / 180;
          var dist = shot.distanceFraction * radius;
          var targetX = Math.round(centerX + dist * Math.cos(rad));
          var targetY = Math.round(centerY + dist * Math.sin(rad));

          if (shot.isSix) {
            var midX = (centerX + targetX) / 2 + (i % 2 === 0 ? 3 : -3);
            var midY = (centerY + targetY) / 2 - 16;
            raysHtml += '<path d="M ' + centerX + ',' + centerY + ' Q ' + midX + ',' + midY + ' ' + targetX + ',' + targetY + '" fill="none" stroke="#FFB800" stroke-width="2.8" stroke-linecap="round" style="filter: drop-shadow(0 0 4px rgba(255, 184, 0, 0.7));"/>';
            raysHtml += '<polygon points="' + targetX + ',' + (targetY - 5) + ' ' + (targetX + 2) + ',' + (targetY - 1) + ' ' + (targetX + 6) + ',' + targetY + ' ' + (targetX + 2) + ',' + (targetY + 1) + ' ' + targetX + ',' + (targetY + 5) + ' ' + (targetX - 2) + ',' + (targetY + 1) + ' ' + (targetX - 6) + ',' + targetY + ' ' + (targetX - 2) + ',' + (targetY - 1) + '" fill="#FFB800"/>';
          } else if (shot.isBoundary) {
            raysHtml += '<line x1="' + centerX + '" y1="' + centerY + '" x2="' + targetX + '" y2="' + targetY + '" stroke="#00E599" stroke-width="2.4" stroke-linecap="round" style="filter: drop-shadow(0 0 3px rgba(0, 229, 153, 0.6));"/>';
            raysHtml += '<circle cx="' + targetX + '" cy="' + targetY + '" r="3.5" fill="#00E599" stroke="#04070D" stroke-width="1"/>';
          } else if (shot.runs > 0) {
            raysHtml += '<line x1="' + centerX + '" y1="' + centerY + '" x2="' + targetX + '" y2="' + targetY + '" stroke="#00D2FF" stroke-width="' + (shot.runs >= 2 ? '1.8' : '1.3') + '" stroke-linecap="round"/>';
            raysHtml += '<circle cx="' + targetX + '" cy="' + targetY + '" r="2" fill="#00D2FF"/>';
          } else {
            raysHtml += '<line x1="' + centerX + '" y1="' + centerY + '" x2="' + targetX + '" y2="' + targetY + '" stroke="#64748B" stroke-width="1.1" stroke-dasharray="3,3" stroke-linecap="round"/>';
            raysHtml += '<circle cx="' + targetX + '" cy="' + targetY + '" r="1.5" fill="#64748B"/>';
          }
        }
        return raysHtml;
      }

      renderWagonPickerSheet() {
        if (!this.wagonPickerOpen) return '';
        var runs = this.pendingWagonRuns;
        var striker = this.matchState.striker;
        var self = this;
        var activeZoneDef = this.SHOT_ZONES_DATA.find(function(z) { return z.id === self.pendingSelectedZone; }) || this.SHOT_ZONES_DATA[5];
        var activeZoneLabel = activeZoneDef.label;
        var activeZoneSide = activeZoneDef.side === 'OFF' ? 'OFF' : 'ON';
        var activeZoneShort = activeZoneDef.shortLabel;
        var isLhb = (this.currentStance === 'LHB');
        var activeDisplayAngle = Math.round(isLhb ? (360 - activeZoneDef.angleDeg) % 360 : activeZoneDef.angleDeg);

        var runsLabel = 'DOT (0 RUNS)';
        var runsColor = '#94a3b8';
        if (runs === 1) { runsLabel = '+1 SINGLE'; runsColor = '#00D2FF'; }

      handleResetButtonClick() {
        if (!this.holdCompleted) {
          this.showToast('Hold ↺ for 2 seconds to reset score', 'warning', 2500);
        }
        this.holdCompleted = false;
      }

      bindHoldToReset() {
        var resetBtn = document.getElementById('btnMobileStudioReset');
        if (!resetBtn) return;
        var self = this;

        var startHold = function(e) {
          if (e.button !== undefined && e.button !== 0) return;
          self.holdCompleted = false;
          resetBtn.classList.add('holding');
          clearTimeout(self.holdConfirmTimer);
          self.holdConfirmTimer = setTimeout(function() {
            self.holdCompleted = true;
            resetBtn.classList.remove('holding');
            self.resetInningsScore();
            if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
          }, 2000);
        };

        var cancelHold = function() {
          clearTimeout(self.holdConfirmTimer);
          resetBtn.classList.remove('holding');
        };

        resetBtn.addEventListener('mousedown', startHold);
        resetBtn.addEventListener('mouseup', cancelHold);
        resetBtn.addEventListener('mouseleave', cancelHold);
        resetBtn.addEventListener('touchstart', startHold, { passive: true });
        resetBtn.addEventListener('touchend', cancelHold, { passive: true });
        resetBtn.addEventListener('touchcancel', cancelHold, { passive: true });
      }

      renderDynamicAnalyticsWagon() {
        var self = this;
        var isLhb = this.analyticsWagonStance === 'LHB';
        var cx = 160;
        var cy = 155;
        var R = 135;

        function polarToXY(radius, angleDeg) {
          var rad = angleDeg * Math.PI / 180.0;
          var sinVal = Math.sin(rad);
          if (isLhb) sinVal = -sinVal;
          return {
            x: cx + (radius * sinVal),
            y: cy - (radius * Math.cos(rad))
          };
        }

        var filteredShots = this.shotHistory.filter(function(s) {
          if (self.analyticsWagonBatter !== 'ALL' && s.batterName !== self.analyticsWagonBatter) return false;
          if (self.analyticsWagonShotType === 'BOUNDARIES' && !s.isBoundary) return false;
          if (self.analyticsWagonShotType === 'SINGLES' && (s.isBoundary || s.runs === 0)) return false;
          if (self.analyticsWagonShotType === 'DOTS' && s.runs > 0) return false;
          if (self.analyticsWagonZone !== 'ALL' && s.zone !== self.analyticsWagonZone) return false;
          return true;
        });

        var totalShots = filteredShots.length;
        var totalRuns = 0;
        var offRuns = 0;
        var onRuns = 0;
        var boundaryCount = 0;
        var dotCount = 0;

        for (var si = 0; si < filteredShots.length; si++) {
          var sh = filteredShots[si];
          totalRuns += sh.runs;
          if (sh.isBoundary) boundaryCount++;
          if (sh.runs === 0) dotCount++;
          var zoneDef = this.SHOT_ZONES_DATA.find(function(zd) { return zd.id === sh.zone; });
          if (zoneDef) {
            if (zoneDef.side === 'OFF') offRuns += sh.runs;
            else onRuns += sh.runs;
          }
        }

        var dotPct = totalShots > 0 ? ((dotCount / totalShots) * 100).toFixed(0) : '0';
        var offRatio = totalRuns > 0 ? Math.round((offRuns / totalRuns) * 100) : 50;
        var onRatio = totalRuns > 0 ? (100 - offRatio) : 50;

        var h = '<div id="mobileWagonPanel" class="analytics-panel-card" style="border-color: rgba(192, 132, 252, 0.35);">';
        
        h += '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem;">';
        h += '<div>';
        h += '<div style="font-size: 0.85rem; font-weight: 800; color: #c084fc; font-family: Space Grotesk, sans-serif;">🎯 360° Precision Wagon Wheel</div>';
        h += '<div style="font-size: 0.65rem; color: #94a3b8;">Interactive 8-zone radial distribution & trajectory rays</div>';

        h += '<div style="display: flex; gap: 0.25rem;">';

        h += '<button type="button" class="mobile-chip" style="font-size: 0.65rem; padding: 0.2rem 0.5rem;" data-mode="3D" onclick="window.cricosMobileApp.setWagonDisplayMode(this.dataset.mode)" data-tooltip="Launch 3D Stadium Orbit">🌐 3D Stadium</button>';
        h += '</div>';
        h += '<div style="display: flex; gap: 0.25rem; background: rgba(0,0,0,0.5); padding: 0.2rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);">';
        h += '<button type="button" class="mobile-chip' + (!isLhb ? ' active' : '') + '" style="font-size: 0.65rem; padding: 0.2rem 0.5rem;" onclick="window.cricosMobileApp.setAnalyticsWagonStance(this.dataset.stance)" data-stance="RHB" data-tooltip="Switch Wagon to Right-Hand Batter stance">RHB</button>';

        }

        for (var zi = 0; zi < this.SHOT_ZONES_DATA.length; zi++) {
          var zoneDef = this.SHOT_ZONES_DATA[zi];
          var startAngle = zi * 45;
          var endAngle = (zi + 1) * 45;
          var pStart = polarToXY(R, startAngle);
          var pEnd = polarToXY(R, endAngle);
          var sweepFlag = isLhb ? 0 : 1;
          var isZoneSelected = this.analyticsWagonZone === zoneDef.id;
          var wedgeFill = isZoneSelected ? 'rgba(192, 132, 252, 0.35)' : 'rgba(0, 229, 153, 0.04)';

        for (var sj = 0; sj < filteredShots.length; sj++) {

    class MobileThreeStadiumPitch {
      constructor() {

        this.sunLight = null;

        this.wagonArcsGroup = null;

      init() {
        const liveCanvas = (typeof document !== 'undefined') ? document.getElementById('mobileThreeStadiumCanvas') : null;

          this.stop();
          this.canvas = liveCanvas;
          this.isInitialized = false;
        }
        if (this.isInitialized && !this.isPaused) {
          this.renderScene3D();
          return;
        }

        this.fallbackNotice = (typeof document !== 'undefined') ? document.getElementById('mobileThreeFallbackNotice') : null;
        if (this.fallbackNotice) this.fallbackNotice.style.display = 'none';

        initMobileThreeFallback();
        const THREE = window.THREE;
        const rect = (typeof this.canvas.getBoundingClientRect === 'function') ? this.canvas.getBoundingClientRect() : { width: 360, height: 320 };
        const width = Math.max(rect.width || 360, 280);
        const height = Math.max(rect.height || 320, 240);

        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 500);
        this.updateCameraFromOrbit();

        // Keep renderer decoupled from live 2D canvas context so 3D Projection Canvas engine always has exclusive, non-blocking access

          domElement: this.canvas,
          setSize: (w, h) => {},
          setPixelRatio: (r) => {},

        // Floodlight towers

        const floodCoords = [[-22, 26, -22], [22, 26, -22], [-22, 26, 22], [22, 26, 22]];
        for (let i = 0; i < floodCoords.length; i++) {
          const fl = new THREE.DirectionalLight(0x00E599, 0.4);
          fl.position.set(floodCoords[i][0], floodCoords[i][1], floodCoords[i][2]);
          this.scene.add(fl);
          this.floodlights.push(fl);
        }

        this.buildStadium();
        this.bindTouchEvents();
        this.isInitialized = true;
        this.isPaused = false;
        this.renderScene3D();

            this.animFrameId = null;

          this.renderScene3D();

      }

      renderScene3D() {
        if (!this.canvas || typeof this.canvas.getContext !== 'function') return;
        const ctx = this.canvas.getContext('2d');
        if (!ctx) return;

        const rect = (typeof this.canvas.getBoundingClientRect === 'function') ? this.canvas.getBoundingClientRect() : { width: 360, height: 320 };
        const dpr = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
        const w = Math.max(Math.round(rect.width || 360), 280);
        const h = Math.max(Math.round(rect.height || 320), 240);
        if (this.canvas.width !== w * dpr || this.canvas.height !== h * dpr) {
          this.canvas.width = w * dpr;
          this.canvas.height = h * dpr;
        }
        ctx.save();
        ctx.scale(dpr, dpr);

        // 1. Sky & Atmosphere Backdrop based on Lighting (DAY / DUSK / NIGHT)
        const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
        if (this.currentLighting === 'DAY') {
          skyGrad.addColorStop(0, '#0C3B5E');
          skyGrad.addColorStop(0.48, '#1E648C');
          skyGrad.addColorStop(1, '#092B1E');
        } else if (this.currentLighting === 'DUSK') {
          skyGrad.addColorStop(0, '#1C0E2E');
          skyGrad.addColorStop(0.45, '#4A1D3D');
          skyGrad.addColorStop(1, '#082218');
        } else {
          skyGrad.addColorStop(0, '#030711');
          skyGrad.addColorStop(0.48, '#081426');
          skyGrad.addColorStop(1, '#041912');
        }
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, h);

        // 2. Compute 3D Perspective Camera Basis
        const cam = this.camera ? this.camera.position : { x: 20, y: 18, z: 24 };
        const tgt = this._lookAtTarget || this.target || { x: 0, y: 0.8, z: 0 };
        let fx = tgt.x - cam.x, fy = tgt.y - cam.y, fz = tgt.z - cam.z;
        const flen = Math.hypot(fx, fy, fz) || 1;
        fx /= flen; fy /= flen; fz /= flen;

        // World up vector (handle vertical top-down camera gracefully)
        const upX = 0, upY = Math.abs(fy) > 0.96 ? 0 : 1, upZ = Math.abs(fy) > 0.96 ? -1 : 0;
        let rx = fy * upZ - fz * upY;
        let ry = fz * upX - fx * upZ;
        let rz = fx * upY - fy * upX;
        const rlen = Math.hypot(rx, ry, rz) || 1;
        rx /= rlen; ry /= rlen; rz /= rlen;

        const ux = ry * fz - rz * fy;
        const uy = rz * fx - rx * fz;
        const uz = rx * fy - ry * fx;

        const focal = (h * 0.5) / Math.tan((45 * Math.PI / 180) * 0.5);
        const cx = w * 0.5;
        const cy = h * 0.52;

        const project = (wx, wy, wz) => {
          const dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;
          const cz = dx * fx + dy * fy + dz * fz;
          if (cz < 0.3) return null;
          const cxCam = dx * rx + dy * ry + dz * rz;
          const cyCam = dx * ux + dy * uy + dz * uz;
          const scale = focal / cz;
          return { x: cx + cxCam * scale, y: cy - cyCam * scale, z: cz, scale };
        };

        const drawRing3D = (radius, yVal, segments, strokeStyle, lineWidth, fillStyle, dashed) => {
          ctx.beginPath();
          let started = false;
          for (let i = 0; i <= segments; i++) {
            const ang = (i / segments) * Math.PI * 2;
            const p = project(Math.cos(ang) * radius, yVal, Math.sin(ang) * radius);
            if (!p) continue;
            if (!started) { ctx.moveTo(p.x, p.y); started = true; }
            else ctx.lineTo(p.x, p.y);
          }
          if (!started) return;
          if (fillStyle) {
            ctx.fillStyle = fillStyle;
            ctx.fill();
          }
          if (strokeStyle) {
            ctx.save();
            if (dashed) ctx.setLineDash(dashed);
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth || 1.5;
            ctx.stroke();
            ctx.restore();
          }
        };

        // 3. Stadium Grandstand Bowl & Floodlight Towers
        drawRing3D(26.5, 3.8, 48, 'rgba(0, 210, 255, 0.28)', 1.5, 'rgba(12, 22, 38, 0.72)', null);
        drawRing3D(25.0, 1.8, 48, 'rgba(255, 255, 255, 0.15)', 1, 'rgba(15, 28, 46, 0.82)', null);

        // 4 Floodlight Pylons & Beams
        const towers = [[-22, 22], [22, 22], [-22, -22], [22, -22]];
        for (let t = 0; t < towers.length; t++) {
          const tx = towers[t][0], tz = towers[t][1];
          const pBase = project(tx, 0, tz);
          const pTop = project(tx, 19, tz);
          const pCenter = project(0, 0, 0);
          if (pBase && pTop) {
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.65)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(pBase.x, pBase.y);
            ctx.lineTo(pTop.x, pTop.y);
            ctx.stroke();

            // Glowing Floodlight Head & Beam
            const beamAlpha = this.currentLighting === 'DAY' ? 0.08 : (this.currentLighting === 'DUSK' ? 0.22 : 0.34);
            if (pCenter) {
              const beamGrad = ctx.createLinearGradient(pTop.x, pTop.y, pCenter.x, pCenter.y);
              beamGrad.addColorStop(0, this.currentLighting === 'DUSK' ? ('rgba(255, 184, 0, ' + beamAlpha + ')') : ('rgba(0, 229, 153, ' + beamAlpha + ')'));
              beamGrad.addColorStop(1, 'rgba(0, 229, 153, 0)');
              ctx.fillStyle = beamGrad;
              ctx.beginPath();
              ctx.moveTo(pTop.x - 5, pTop.y);
              ctx.lineTo(pTop.x + 5, pTop.y);
              ctx.lineTo(pCenter.x + 55, pCenter.y);
              ctx.lineTo(pCenter.x - 55, pCenter.y);
              ctx.closePath();
              ctx.fill();
            }
            ctx.fillStyle = this.currentLighting === 'DUSK' ? '#FFB800' : '#F8FAFC';

            ctx.fill();
          }
        }

        // 4. Lush Turf Outfield & Mowing Stripes
        const turfColor = this.currentLighting === 'DAY' ? '#135E3B' : (this.currentLighting === 'DUSK' ? '#0F4D30' : '#0A3E27');
        drawRing3D(23.5, 0, 60, '#1E293B', 2, turfColor, null);
        drawRing3D(19.5, 0.01, 52, null, 0, 'rgba(0, 229, 153, 0.05)', null);
        drawRing3D(15.5, 0.02, 48, null, 0, 'rgba(0, 0, 0, 0.14)', null);
        drawRing3D(11.2, 0.03, 48, 'rgba(255, 255, 255, 0.75)', 1.5, 'rgba(0, 229, 153, 0.06)', [5, 4]); // 30-Yard Restriction Ring
        drawRing3D(22.2, 0.05, 60, '#00E599', 2.4, null, null); // Glowing Boundary Rope

        // 5. 22-Yard Clay Pitch Strip & Crease Markings
        const pitchCorners = [
          project(-1.65, 0.04, -6.5),
          project(1.65, 0.04, -6.5),

          ctx.lineTo(pitchCorners[1].x, pitchCorners[1].y);
          ctx.lineTo(pitchCorners[2].x, pitchCorners[2].y);
          ctx.lineTo(pitchCorners[3].x, pitchCorners[3].y);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // Popping Creases & Stumps at both ends (z = -5.8 and z = +5.8)
        [-5.8, 5.8].forEach(zEnd => {
          const cL = project(-1.65, 0.06, zEnd * 0.88);

          if (cL && cR) {
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cL.x, cL.y);
            ctx.lineTo(cR.x, cR.y);
            ctx.stroke();
          }
          [-0.24, 0, 0.24].forEach(sx => {
            const sb = project(sx, 0.05, zEnd);
            const st = project(sx, 0.88, zEnd);
            if (sb && st) {
              ctx.strokeStyle = '#FDE047';
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(sb.x, sb.y);
              ctx.lineTo(st.x, st.y);
              ctx.stroke();
            }
          });
          const bL = project(-0.26, 0.9, zEnd);
          const bR = project(0.26, 0.9, zEnd);
          if (bL && bR) {
            ctx.strokeStyle = '#FEF08A';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bL.x, bL.y);
            ctx.lineTo(bR.x, bR.y);
            ctx.stroke();
          }
        });

        const mode = this.currentMode || 'FUSION';
        const isFusion = mode === 'FUSION';
        const isLhb = !!(window.cricosMobileApp && window.cricosMobileApp.currentStance === 'LHB');
        const stanceSign = isLhb ? -1 : 1;

        // 6. Layer: 11 Fielders (FIELD / FIELDERS / FUSION)
        if (isFusion || mode === 'FIELD' || mode === 'FIELDERS') {
          const fielders = [
            { x: 0, z: 7.4, role: 'WK' },
            { x: -1.6 * stanceSign, z: 7.1, role: 'Slip' },
            { x: -9.5 * stanceSign, z: 3.5, role: 'Point' },
            { x: -8.5 * stanceSign, z: -4.2, role: 'Cover' },
            { x: -3.8 * stanceSign, z: -10.2, role: 'Mid-Off' },
            { x: 3.8 * stanceSign, z: -10.2, role: 'Mid-On' },
            { x: 8.8 * stanceSign, z: -2.5, role: 'Mid-Wkt' },
            { x: 8.2 * stanceSign, z: 4.5, role: 'Sq Leg' },
            { x: 5.5 * stanceSign, z: 16.5, role: 'Fine Leg' },
            { x: -12.5 * stanceSign, z: 15.0, role: '3rd Man' },
            { x: 11.5 * stanceSign, z: -16.5, role: 'Long On' }
          ];
          for (let f = 0; f < fielders.length; f++) {
            const fd = fielders[f];
            const pf = project(fd.x, 0.1, fd.z);
            const pt = project(fd.x, 1.15, fd.z);
            if (pf && pt) {

              ctx.fillStyle = 'rgba(0, 229, 153, 0.24)';
              ctx.beginPath();
              ctx.arc(pf.x, pf.y, Math.max(4, pf.scale * 0.9), 0, Math.PI * 2);
              ctx.fill();

              ctx.strokeStyle = '#00E599';
              ctx.lineWidth = 2.6;
              ctx.beginPath();
              ctx.moveTo(pf.x, pf.y);
              ctx.lineTo(pt.x, pt.y);
              ctx.stroke();

              ctx.fillStyle = '#F8FAFC';
              ctx.beginPath();
              ctx.arc(pt.x, pt.y - 2, 3, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = '#E2E8F0';
              ctx.font = '700 8px "Plus Jakarta Sans", sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(fd.role, pt.x, pt.y - 7);
            }
          }
        }

        // 7. Layer: 3D Parabolic Wagon Wheel Shot Arcs (WAGON / FUSION)
        if (isFusion || mode === 'WAGON') {
          const shots = [
            { tx: -16 * stanceSign, tz: -14, h: 7.5, color: '#00E599', label: '104m SIX (OFF)' },
            { tx: 17 * stanceSign, tz: -13, h: 8.2, color: '#00E599', label: '108m SIX (ON)' },
            { tx: -19 * stanceSign, tz: 4, h: 2.2, color: '#00D2FF', label: '68m FOUR (OFF)' },
            { tx: 18 * stanceSign, tz: 6, h: 2.0, color: '#00D2FF', label: '66m FOUR (ON)' },
            { tx: 0, tz: -21, h: 8.6, color: '#00E599', label: '112m SIX' },
            { tx: -10 * stanceSign, tz: 12, h: 1.4, color: '#FFB800', label: '2 Runs' },
            { tx: 11 * stanceSign, tz: 11, h: 1.5, color: '#FFB800', label: '2 Runs' }
          ];
          const pulseT = ((Date.now() % 2400) / 2400);
          for (let s = 0; s < shots.length; s++) {
            const sh = shots[s];
            ctx.beginPath();
            let started = false;
            let endPt = null;
            for (let step = 0; step <= 24; step++) {
              const t = step / 24;
              const wx = sh.tx * t;
              const wz = 5.6 + (sh.tz - 5.6) * t;
              const wy = 0.2 + 4 * sh.h * t * (1 - t);
              const p = project(wx, wy, wz);
              if (!p) continue;
              if (!started) { ctx.moveTo(p.x, p.y); started = true; }
              else ctx.lineTo(p.x, p.y);
              if (step === 24) endPt = p;
            }
            if (started) {
              ctx.strokeStyle = sh.color;
              ctx.lineWidth = 2.2;
              ctx.stroke();

              const bt = (pulseT + s * 0.14) % 1;
              const bx = sh.tx * bt;

              const bp = project(bx, by, bz);
